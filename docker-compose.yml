services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clients_db
    ports:
      - "5000:5000"
    volumes:
      # Files here run automatically (alphabetical order) on first start
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "synchronous_commit=off"]
